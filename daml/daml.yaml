# TruthOracle - Canton Network DAML contracts
# Prediction market platform for Canton Network testnet

sdk-version: "3.4.10"
# Breaking protocol rewrites get a new package *name* (truthoracle -> v5 -> v10 -> v11 -> v12 -> v13):
# Canton 3.x smart-contract-upgrade checks reject schema-incompatible DARs uploaded
# under an existing package name.
# v13: in-app UserWallet - trades debit/credit an on-ledger balance in one transaction.
name: truthoracle-v13
version: 1.0.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
