      properties:
        partyId:
          type: string
        preparedTxB64:
          type: string
        hashingSchemeVersion:
          type: string
        hashB64:
          type: string
        commandId:
          type: string
    Queued:
      title: Queued
      type: object
    Submitted:
      title: Submitted
      type: object
      required:
      - commandId
      properties:
        commandId:
          type: string
    TokenOffer:
      title: TokenOffer
      type: object
      required:
