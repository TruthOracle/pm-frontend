      - senderPartyId
      - instrumentId
      - amount
      properties:
        offerId:
          type: string
        senderPartyId:
          type: string
        instrumentId:
          type: string
        amount:
          type: string
    TransferOrderRequest:
      title: TransferOrderRequest
      type: object
      required:
      - orderId
      - from
      - to
      - instrumentId
      - transferAmount
      - metadata
      properties:
        orderId:
          type: string
        from:
          type: string
        to:
          type: string
        instrumentId:
          type: string
        transferAmount:
          type: number
          format: double
        reason:
          type: string
        app:
          type: string
        metadata:
          $ref: '#/components/schemas/Map_String'
    TransferOrderStatus:
      title: TransferOrderStatus
      oneOf:
      - $ref: '#/components/schemas/Batched'
      - $ref: '#/components/schemas/Queued'
    TransferRequest:
      title: TransferRequest
      type: object
      required:
      - from
      - to
      - instrumentId
      - transferAmount
      - metadata
      properties:
        from:
          type: string
        to:
          type: string
        instrumentId:
          type: string
        transferAmount:
          type: string
        reason:
          type: string
        app:
          type: string
        metadata:
          $ref: '#/components/schemas/Map_String'
        commandId:
          type: string
    TransferStatusResponse:
      title: TransferStatusResponse
      type: object
      required:
      - status
      properties:
        status:
          type: string
