components:
  schemas:
    Accepted:
      title: Accepted
      type: object
      required:
      - commandId
      - status
      properties:
        commandId:
          type: string
        status:
          type: string
        updateId:
          type: string
        statusTime:
          type: string
    AccountInfoResponse:
      title: AccountInfoResponse
      type: object
      required:
      - accountName
      - derivationPath
      - validatorId
      - isActive
      properties:
        accountName:
          type: string
        derivationPath:
          type: string
        validatorId:
          type: integer
          format: int32
        publicKeyHex:
          type: string
        partyId:
          type: string
        isActive:
          type: boolean
    BadRequest:
      title: BadRequest
      type: object
      required:
      - error
      - timestamp
      properties:
        error:
          type: string
        timestamp:
          type: string
    BalanceResponse:
      title: BalanceResponse
      type: object
      required:
      - holdings
      properties:
        holdings:
          $ref: '#/components/schemas/Map_HoldingResponse'
    BatchSendRequest:
      title: BatchSendRequest
      type: object
      required:
      - from
      properties:
        from:
          type: string
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/BatchTransferItemRequest'
        app:
          type: string
        commandId:
          type: string
    BatchStatus:
      title: BatchStatus
      oneOf:
      - $ref: '#/components/schemas/Accepted'
      - $ref: '#/components/schemas/Confirmed'
      - $ref: '#/components/schemas/Failed'
      - $ref: '#/components/schemas/Prepared'
      - $ref: '#/components/schemas/Submitted'
    BatchTransferItemRequest:
      title: BatchTransferItemRequest
      type: object
      required:
      - receiverPartyId
      - instrumentId
      - amount
      properties:
        receiverPartyId:
          type: string
        instrumentId:
          type: string
        amount:
          type: string
        reason:
          type: string
        metadata:
          $ref: '#/components/schemas/Map_String'
    Batched:
      title: Batched
      type: object
      required:
      - batchId
      - autoBatchStatus
      properties:
        batchId:
          type: string
        autoBatchStatus:
          $ref: '#/components/schemas/BatchStatus'
    CommandStatusResponse:
      title: CommandStatusResponse
      type: object
      required:
      - status
      properties:
        status:
          type: string
        updateId:
          type: string
        statusTime:
          type: string
    Confirmed:
      title: Confirmed
      type: object
      required:
      - commandId
      properties:
        commandId:
          type: string
        updateId:
          type: string
        statusTime:
          type: string
    Conflict:
      title: Conflict
      type: object
      required:
      - error
      - timestamp
      properties:
        error:
          type: string
        timestamp:
          type: string
    CreateAccountRequest:
      title: CreateAccountRequest
      type: object
      required:
      - desiredAccountName
      - validatorId
      - preApproveAmuletTransfers
      properties:
        desiredAccountName:
          type: string
        validatorId:
          type: integer
          format: int32
        preApproveAmuletTransfers:
          type: boolean
        coupon:
          type: string
    ExternalExecuteRequest:
      title: ExternalExecuteRequest
      type: object
      required:
      - partyId
      - appName
      - commandId
      - preparedTxB64
      - hashingSchemeVersion
      - signatureB64
      properties:
        partyId:
          type: string
        appName:
          type: string
        commandId:
          type: string
        preparedTxB64:
          type: string
        hashingSchemeVersion:
          type: string
        signatureB64:
          type: string
    ExternalExecuteResponse:
      title: ExternalExecuteResponse
      type: object
      required:
      - status
      properties:
        status:
          type: string
    ExternalPrepareRequest:
      title: ExternalPrepareRequest
      type: object
      required:
      - partyId
      - appName
      - commandId
      properties:
        partyId:
          type: string
        appName:
          type: string
        commandId:
          type: string
        commands:
          type: array
          items:
            type: object
        disclosedContracts:
          type: array
          items:
            type: string
    ExternalPrepareResponse:
      title: ExternalPrepareResponse
      type: object
      required:
      - preparedTxB64
      - hashingSchemeVersion
      - hashB64
      properties:
        preparedTxB64:
          type: string
        hashingSchemeVersion:
          type: string
        hashB64:
          type: string
    ExternalSubmitRequest:
      title: ExternalSubmitRequest
      type: object
      required:
      - partyId
      - appName
      - commandId
      properties:
        partyId:
          type: string
        appName:
          type: string
        commandId:
          type: string
        commands:
          type: array
          items:
            type: object
        disclosedContracts:
          type: array
          items:
            type: string
    ExternalSubmitResponse:
      title: ExternalSubmitResponse
      type: object
      required:
      - commandId
      - status
      properties:
        commandId:
          type: string
        status:
          type: string
    Failed:
      title: Failed
      type: object
      required:
      - commandId
      - reason
      properties:
        commandId:
          type: string
        reason:
          type: string
        updateId:
          type: string
        statusTime:
          type: string
    Forbidden:
      title: Forbidden
      type: object
      required:
      - error
      - timestamp
      properties:
        error:
          type: string
        timestamp:
          type: string
    HealthStatus:
      title: HealthStatus
      oneOf:
      - $ref: '#/components/schemas/Healthy'
      - $ref: '#/components/schemas/Unhealthy'
    HealthStatusResponse:
      title: HealthStatusResponse
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
    Healthy:
      title: Healthy
      type: object
    HoldingResponse:
      title: HoldingResponse
      type: object
      required:
      - balance
      - balanceUsd
      properties:
        balance:
          type: string
        balanceUsd:
          type: string
        instrumentAdminId:
          type: string
    InternalServerError:
      title: InternalServerError
      type: object
      required:
      - error
      - timestamp
      properties:
        error:
          type: string
        timestamp:
          type: string
    Map_HoldingResponse:
      title: Map_HoldingResponse
      type: object
      additionalProperties:
        $ref: '#/components/schemas/HoldingResponse'
    Map_String:
      title: Map_String
      type: object
      additionalProperties:
        type: string
    NotFound:
      title: NotFound
      type: object
      required:
      - error
      - timestamp
      properties:
        error:
          type: string
        timestamp:
          type: string
    Prepared:
      title: Prepared
      type: object
