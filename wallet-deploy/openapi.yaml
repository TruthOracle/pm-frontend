          $ref: '#/components/schemas/TransferTransactionResponse'
    TransferTransactionResponse:
      title: TransferTransactionResponse
      type: object
      required:
      - partyId
      - partyId2
      - direction
      - amount
      - instrumentId
      - updateId
      - commandId
      - ledgerOffset
      properties:
        partyId:
          type: string
        partyId2:
          type: string
        direction:
          type: string
        amount:
          type: string
        instrumentId:
          type: string
        reason:
          type: string
        updateId:
          type: string
        commandId:
          type: string
        ledgerOffset:
          type: integer
          format: int32
        recordTime:
          type: string
        createdAt:
          type: string
    Unauthorized:
      title: Unauthorized
      type: object
      required:
      - error
      - timestamp
      properties:
        error:
          type: string
        timestamp:
          type: string
    Unhealthy:
      title: Unhealthy
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
    UnprocessableEntity:
      title: UnprocessableEntity
      type: object
      required:
      - error
      - timestamp
      properties:
        error:
          type: string
        timestamp:
          type: string
    UsdcBridgeMintResultsResponse:
      title: UsdcBridgeMintResultsResponse
      type: object
      properties:
        commandIds:
          type: array
          items:
            type: string
    UsdcBridgeWithdrawRequest:
      title: UsdcBridgeWithdrawRequest
      type: object
      required:
      - amount
      - destinationRecipient
      - reference
      - requestId
      - commandId
      properties:
        amount:
          type: string
        destinationRecipient:
          type: string
        reference:
          type: string
        requestId:
          type: string
        commandId:
          type: string
  securitySchemes:
